BB_CONF_FRAGMENT_SUMMARY = "Drop the hvc0 serial console on QEMU machines."
BB_CONF_FRAGMENT_DESCRIPTION = "Several QEMU machines list hvc0 in SERIAL_CONSOLES, so in nographic \
mode runqemu adds console=hvc0 to the kernel command line without creating the virtio console \
device behind it (QB_SERIAL_OPT is only applied with the serial option). Removing hvc0 drops \
the console= argument and the getty on hvc0, leaving the machine's primary console. \
"

SERIAL_CONSOLES:remove:qemuall = "115200;hvc0"
