BB_CONF_FRAGMENT_SUMMARY = "Always add the QEMU virtio console devices, including in nographic mode."
BB_CONF_FRAGMENT_DESCRIPTION = "runqemu only applies QB_SERIAL_OPT (the virtio console devices) \
when not running in nographic mode. This fragment appends QB_SERIAL_OPT to QB_OPT_APPEND so \
the virtio console is always present. \
"

# Fix for qemuarm virtio console issue in nographic mode
# Ensure virtio console devices are always included in QB_OPT_APPEND
# This works around the issue where runqemu doesn't apply QB_SERIAL_OPT in nographic mode
QB_OPT_APPEND:append = " ${QB_SERIAL_OPT}"
