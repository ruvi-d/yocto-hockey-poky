header:
  version: 11

machine: beaglebone-yocto
distro: poky
target:
  - core-image-minimal

repos:
  poky:
    url: git://git.yoctoproject.org/poky
    tag: scarthgap-5.0.14
    path: sources/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

local_conf_header:
  temp-conf: |
    EXTRA_IMAGE_FEATURES += "empty-root-password \
                             allow-empty-password \
                             allow-root-login \
                             "
