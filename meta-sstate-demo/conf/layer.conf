# Throwaway layer for learning sstate / signature debugging.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "sstate-demo"
BBFILE_PATTERN_sstate-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_sstate-demo = "1"

LAYERDEPENDS_sstate-demo = "core"
LAYERSERIES_COMPAT_sstate-demo = "wrynose"
